name: parliament_ips
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+3

environment:
  sdk: ^3.11.0

dependencies:
  flutter:      
    sdk: flutter

  get: ^4.7.3
  dropdown_search: ^7.0.0
  flutter_reactive_ble: ^5.4.0
  supabase_flutter: ^2.8.0
  flutter_dotenv: ^5.2.1
  cupertino_icons: ^1.0.1
  permission_handler: ^13.0.0
  flutter_compass: ^0.8.1
  shared_preferences: ^2.5.5
  sentry_flutter: ^9.30.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.3
  icons_launcher: ^3.1.0

# flutter_native_splash config. After changing anything here, regenerate
# the native splash resources with:
#   dart run flutter_native_splash:create
# This must be re-run any time this section or the referenced image
# changes -- editing this file alone does not touch the generated
# Android/iOS native assets.
flutter_native_splash:
  color: "#141414"
  image: assets/images/splash_logo.png
  fullscreen: true
  android_gravity: center
  android_12:
    color: "#141414"
    image: assets/images/splash_logo.png
    icon_background_color: "#141414"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/images/onboarding/
    - .env
    - shorebird.yaml

  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Mulish
      fonts:
        - asset: assets/fonts/mulish/Mulish-Regular.ttf
        - asset: assets/fonts/mulish/Mulish-Bold.ttf
          weight: 700
        - asset: assets/fonts/mulish/Mulish-Light.ttf
          weight: 300
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
